<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map: solar farm land near airports, with the power grid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1b2430;background:#fff;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid #e3e7ee;flex-wrap:wrap}
header a.back{color:#1557b0;text-decoration:none;font-size:14px}
header h1{font-size:17px;font-weight:600;margin:0;flex:1 1 300px;letter-spacing:-.01em}
.wrap{flex:1;display:flex;min-height:0;flex-wrap:wrap}
aside{width:340px;max-width:100%;border-right:1px solid #e3e7ee;display:flex;flex-direction:column;min-height:0}
.filters{padding:14px 16px 10px;border-bottom:1px solid #e3e7ee}
.kick{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#56616f;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid #cfd6df;background:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;color:#1b2430;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.chip[aria-pressed="true"]{background:#1b2430;color:#fff;border-color:#1b2430}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #cfd6df;border-radius:8px;background:#fff}
.sort{display:flex;gap:8px;align-items:center;font-size:13px;color:#56616f}
.list{overflow:auto;flex:1;min-height:200px}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef1f5;background:#fff;padding:12px 16px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:#f6f8fb}.item[aria-current="true"]{background:#eef4fd;box-shadow:inset 3px 0 0 #1f6fd1}
.item b{display:block;font-size:14.5px;font-weight:600}.item small{display:block;color:#56616f;font-size:12.5px;margin-top:2px}
.metrics{display:flex;gap:14px;margin-top:6px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:#1b2430;flex-wrap:wrap}
#map{flex:999 1 560px;min-width:0;min-height:420px;position:relative;background:#e9edf2}
.note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#56616f}
.legend{position:absolute;left:12px;bottom:24px;background:rgba(255,255,255,.95);border-radius:10px;padding:10px 12px;font-size:12.5px;box-shadow:0 8px 24px -12px rgba(16,24,40,.4);z-index:5;max-width:260px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.bar{height:8px;width:110px;border-radius:4px;background:linear-gradient(90deg,#fff3c4,#fdc24a,#ef7f1a,#b63a0b,#6b1203)}
.credits{font-size:11.5px;color:#56616f;padding:8px 16px;border-top:1px solid #e3e7ee}
.info{font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:1.45;max-width:240px}.info b{font-size:14px}
@media (max-width:760px){aside{width:100%;border-right:0;max-height:46vh}#map{min-height:54vh}}
</style>
</head>
<body>
<header><a class="back" href="./">&larr; Back to the study</a><h1>Solar farm land near airports, with the power grid</h1></header>
<div class="wrap">
<aside>
<div class="filters">
<p class="kick">Layers</p>
<div class="chips" id="layers">
<button class="chip" data-layer="avail" aria-pressed="true"><span class="sw" style="background:#8ec5ff"></span>Usable land</button>
<button class="chip" data-layer="grid" aria-pressed="true"><span class="sw" style="background:#1f6fd1"></span>Within 2 km of the grid</button>
<button class="chip" data-layer="score" aria-pressed="false"><span class="sw" style="background:#ef7f1a"></span>Model score</button>
<button class="chip" data-layer="lines" aria-pressed="true"><span class="sw" style="background:#e11d48"></span>Power lines</button>
<button class="chip" data-layer="farms" aria-pressed="true"><span class="sw" style="background:#facc15"></span>Existing solar farms</button>
<button class="chip" data-layer="circle" aria-pressed="true"><span class="sw" style="border:2px solid #fff;background:transparent;outline:1px solid #8a94a3"></span>5 km circle</button>
</div>
<p class="kick">Power lines shown</p>
<div class="chips" id="kv">
<button class="chip" data-kv="0" aria-pressed="true">All</button>
<button class="chip" data-kv="115" aria-pressed="false">115 kV and up</button>
<button class="chip" data-kv="230" aria-pressed="false">230 kV and up</button>
</div>
<div class="sort"><label for="sort">Sort airports by</label>
<select id="sort"><option value="grid2_h2">Hydrogen from grid-ready land</option><option value="available_h2">Hydrogen from all usable land</option><option value="grid2_km2">Grid-ready land</option><option value="airport_to_line_km">Distance to nearest line</option><option value="name">Name</option></select></div>
</div>
<div class="list" id="list" role="list"></div>
<div class="credits" id="credits"></div>
</aside>
<div id="map"><div class="note" id="note">Loading map&hellip;</div>
<div class="legend" id="legend" hidden>
<div><span class="sw" style="background:#8ec5ff"></span>Usable open land</div>
<div><span class="sw" style="background:#1f6fd1"></span>Usable and within 2 km of a power line</div>
<div><span class="bar"></span>Model score 0.5 &rarr; 1.0</div>
<div><span class="sw" style="background:#e11d48;height:3px;width:16px;border-radius:2px"></span>Transmission line (thicker = higher voltage)</div>
<div><span class="sw" style="background:#facc15"></span>Existing solar farm</div>
</div>
</div>
</div>
<script src="./map-config.js"></script>
<script>
(function () {
  const S = { layers: { avail: true, grid: true, score: false, lines: true, farms: true, circle: true }, kv: 0, sort: "grid2_h2", current: null };
  let map, airports = [], lines = null, farms = null, overlays = {}, circles = {}, markers = {}, info;
  const $ = (q) => document.querySelector(q);
  const fmt = (v, d = 1) => (v == null || isNaN(v)) ? "n/a" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });

  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("a")) S.current = h.get("a");
    if (h.get("l")) { const on = h.get("l").split(","); Object.keys(S.layers).forEach(k => S.layers[k] = on.includes(k)); }
    if (h.get("kv")) S.kv = +h.get("kv");
  }
  function writeHash() {
    const on = Object.keys(S.layers).filter(k => S.layers[k]).join(",");
    history.replaceState(null, "", "#" + new URLSearchParams({ ...(S.current ? { a: S.current } : {}), l: on, kv: S.kv }).toString());
  }
  function syncChips() {
    document.querySelectorAll("#layers .chip").forEach(b => b.setAttribute("aria-pressed", S.layers[b.dataset.layer]));
    document.querySelectorAll("#kv .chip").forEach(b => b.setAttribute("aria-pressed", +b.dataset.kv === S.kv));
  }

  function renderList() {
    const a = airports.slice().sort((x, y) => S.sort === "name" ? x.name.localeCompare(y.name)
      : S.sort === "airport_to_line_km" ? (x[S.sort] ?? 1e9) - (y[S.sort] ?? 1e9) : (y[S.sort] ?? -1) - (x[S.sort] ?? -1));
    $("#list").innerHTML = "";
    a.forEach(r => {
      const b = document.createElement("button"); b.className = "item"; b.setAttribute("role", "listitem");
      b.setAttribute("aria-current", r.faa_id === S.current);
      b.innerHTML = `<b>${r.name}</b><small>${r.faa_id} &middot; ${r.state}</small>
        <div class="metrics"><span title="Hydrogen upper bound from grid-ready land">${fmt(r.grid2_h2, 0)} t H&#8322;/day</span>
        <span title="Usable land within 2 km of a line">${fmt(r.grid2_km2)} km&sup2; grid-ready</span>
        <span title="Distance from the airport to the nearest line">${r.airport_to_line_km == null ? "no line" : fmt(r.airport_to_line_km) + " km to line"}</span></div>`;
      b.onclick = () => go(r.faa_id, true);
      $("#list").appendChild(b);
    });
  }

  function go(id, preset) {
    S.current = id; const r = airports.find(x => x.faa_id === id);
    if (preset) { S.layers = { avail: true, grid: true, score: false, lines: true, farms: true, circle: true }; syncChips(); }
    if (map && r) map.fitBounds({ west: r.box[0], south: r.box[1], east: r.box[2], north: r.box[3] }, 0);
    renderList(); applyLayers(); writeHash();
  }

  function applyLayers() {
    if (!map) return;
    Object.entries(overlays).forEach(([key, ov]) => { const k = key.split("_")[1]; ov.setMap(S.layers[k] ? map : null); });
    Object.values(circles).forEach(c => c.setMap(S.layers.circle ? map : null));
    map.data.setStyle(f => {
      const t = f.getProperty("_t");
      if (t === "line") {
        const kv = f.getProperty("VOLTAGE") || 0; const show = S.layers.lines && (S.kv === 0 || kv >= S.kv);
        return { visible: show, strokeColor: "#e11d48", strokeOpacity: .9, strokeWeight: kv >= 345 ? 4 : kv >= 230 ? 3 : kv >= 115 ? 2.2 : 1.5, zIndex: 3 };
      }
      return { visible: S.layers.farms, fillColor: "#facc15", fillOpacity: .55, strokeColor: "#a16207", strokeWeight: 1, zIndex: 2 };
    });
  }

  async function init() {
    readHash();
    const [a, l, f] = await Promise.all(["data/map/airports.json", "data/map/transmission_lines.geojson", "data/map/solar_farms.geojson"].map(u => fetch(u).then(r => r.json())));
    airports = a; lines = l; farms = f;
    $("#credits").innerHTML = "Power lines: HIFLD via GeoPlatform ArcGIS Online (2023). Solar farms: USPVDB (USGS, LBNL). Land and scores: this study (ESA WorldCover, USGS 3DEP, AlphaEarth). Upper bounds, not site assessments.";
    renderList(); syncChips();
    document.querySelectorAll("#layers .chip").forEach(b => b.onclick = () => { S.layers[b.dataset.layer] = !S.layers[b.dataset.layer]; syncChips(); applyLayers(); writeHash(); });
    document.querySelectorAll("#kv .chip").forEach(b => b.onclick = () => { S.kv = +b.dataset.kv; syncChips(); applyLayers(); writeHash(); });
    $("#sort").onchange = (e) => { S.sort = e.target.value; renderList(); };
    if (!window.GMAPS_KEY) { $("#note").textContent = "Map key not set yet."; return; }
    window.__initMap = () => startMap();
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(window.GMAPS_KEY)}&v=weekly&loading=async&libraries=marker&callback=__initMap`;
    s.async = true; s.onerror = () => { $("#note").textContent = "Google Maps could not load."; };
    document.head.appendChild(s);
  }

  function startMap() {
    $("#note").remove(); $("#legend").hidden = false;
    map = new google.maps.Map($("#map"), { mapId: window.GMAPS_MAP_ID || "DEMO_MAP_ID", mapTypeId: "hybrid", center: { lat: 38, lng: -96 }, zoom: 4, streetViewControl: false, fullscreenControl: true, mapTypeControl: true, tilt: 0 });
    info = new google.maps.InfoWindow();
    airports.forEach(r => {
      const b = { west: r.box[0], south: r.box[1], east: r.box[2], north: r.box[3] };
      ["avail", "grid", "score"].forEach(k => overlays[`${r.faa_id}_${k}`] = new google.maps.GroundOverlay(`data/map/overlays/${r.faa_id}_${k}.png`, b, { clickable: false, opacity: 1 }));
      circles[r.faa_id] = new google.maps.Circle({ center: { lat: r.lat, lng: r.lon }, radius: 5000, strokeColor: "#ffffff", strokeWeight: 2, strokeOpacity: .95, fillOpacity: 0, clickable: false });
      markers[r.faa_id] = new google.maps.marker.AdvancedMarkerElement({ position: { lat: r.lat, lng: r.lon }, map, title: r.name, gmpClickable: true });
      markers[r.faa_id].addEventListener("gmp-click", () => {
        info.setContent(`<div class="info"><b>${r.name}</b><br>Usable land: ${fmt(r.available_km2)} km&sup2;<br>Within 2 km of a line: ${fmt(r.grid2_km2)} km&sup2;<br>Hydrogen (upper bound): ${fmt(r.grid2_h2, 0)} t/day from grid-ready land<br>Nearest line: ${r.airport_to_line_km == null ? "none within 12 km" : fmt(r.airport_to_line_km) + " km"}</div>`);
        info.open({ map, anchor: markers[r.faa_id] }); go(r.faa_id, false);
      });
    });
    lines.features.forEach(x => x.properties._t = "line"); farms.features.forEach(x => x.properties._t = "farm");
    map.data.addGeoJson(lines); map.data.addGeoJson(farms);
    map.data.addListener("click", e => {
      if (e.feature.getProperty("_t") === "line") info.setContent(`<div class="info"><b>Transmission line</b><br>${e.feature.getProperty("VOLTAGE") > 0 ? e.feature.getProperty("VOLTAGE") + " kV" : (e.feature.getProperty("VOLT_CLASS") || "voltage not recorded")}<br>${e.feature.getProperty("OWNER") || ""}</div>`);
      else info.setContent(`<div class="info"><b>${e.feature.getProperty("p_name") || "Solar farm"}</b><br>${e.feature.getProperty("p_cap_ac") ? e.feature.getProperty("p_cap_ac") + " MW (AC)" : ""} ${e.feature.getProperty("p_year") ? "&middot; opened " + e.feature.getProperty("p_year") : ""}</div>`);
      info.setPosition(e.latLng); info.open(map);
    });
    applyLayers();
    if (S.current) go(S.current, false);
    else { const bb = new google.maps.LatLngBounds(); airports.forEach(r => bb.extend({ lat: r.lat, lng: r.lon })); map.fitBounds(bb, 40); }
  }
  init();
})();
</script>
</body>
</html>
